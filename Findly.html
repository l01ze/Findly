<style>
  :root{ --bg:#f6f7fb; --ink:#0f172a; }
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  html{ width:100%; max-width:100%; overflow-x:hidden; margin:0; padding:0; }
  body{ width:100%; max-width:100%; overflow-x:clip; margin:0; padding:0;
    font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
  #root{ width:100%; max-width:100%; overflow-x:clip; }
  body[dir="rtl"]{ font-family:'Noto Sans Arabic','Inter',sans-serif; }
  .no-sb::-webkit-scrollbar{display:none}
  .no-sb{-ms-overflow-style:none;scrollbar-width:none}
  .grad{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%)}
  .card-s{box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px -8px rgba(15,23,42,.08)}
  .card-s-h{box-shadow:0 2px 6px rgba(15,23,42,.05),0 20px 40px -14px rgba(99,102,241,.2)}
  @keyframes sh{0%{background-position:-400px 0}100%{background-position:400px 0}}
  .skel{background:linear-gradient(90deg,#eceef2 0%,#f6f7f9 50%,#eceef2 100%);background-size:800px 100%;animation:sh 1.4s infinite linear}
  @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .fu{animation:fu .32s cubic-bezier(.2,.7,.3,1) both}
  @keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .pop{animation:pop .3s ease-out}
  @keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .su{animation:su .28s cubic-bezier(.2,.7,.3,1)}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  .fi{animation:fi .2s ease-out}
  @keyframes si{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .si{animation:si .24s cubic-bezier(.2,.7,.3,1)}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
  .live-dot{animation:pulseDot 1.8s ease-in-out infinite}
  @keyframes pulseRing{0%{transform:scale(.6);opacity:.6}80%,100%{transform:scale(2.2);opacity:0}}
  .leaflet-container{font-family:inherit;background:#eef1f6}
  .leaflet-control-attribution{font-size:9px !important;background:rgba(255,255,255,.8) !important}
  .mpin{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 6px 14px rgba(15,23,42,.28)}
  .mpin>span{transform:rotate(45deg);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900}
  .demo-stripe{
    background-image: repeating-linear-gradient(
      45deg,
      rgba(251,146,60,.14) 0px,
      rgba(251,146,60,.14) 10px,
      rgba(251,146,60,.06) 10px,
      rgba(251,146,60,.06) 20px
    );
  }
  .hscroll{ display:flex; overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory;
    max-width:100%; box-sizing:border-box; }
  .hscroll > * { scroll-snap-align:start; flex:0 0 auto; }
  .l2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .l3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .chip-on{background:#6366f1;color:#fff;border-color:#6366f1}
  .backdrop{background:rgba(15,23,42,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .lang-item:hover{background:#f1f5f9}
  main, header, section, aside, article, nav { max-width:100%; }
  .map-wrap, .map-wrap .leaflet-container{ width:100%; max-width:100%; box-sizing:border-box; }
</style>

function areaFromCoords(lat, lng, fallback){
  let best = null;
  let bestDist = Infinity;
  for (const a of OMAN_AREA_CENTRES){
    const d = haversine(lat, lng, a.lat, a.lng);
    if (d < bestDist){
      best = a.name;
      bestDist = d;
    }
  }
  if (bestDist > 150) return fallback || 'Oman';
  return best;
}

    return s;
  };
}

/* ============= HELPERS ============= */
function agoLabel(iso){
  const diff = (Date.now() - new Date(iso).getTime())/60000;
  if (diff < 1) return 'now';
  if (diff < 60) return `${Math.round(diff)}m ago`;
  const h = diff/60;
  if (h < 24) return `${Math.round(h)}h ago`;
  return `${Math.round(h/24)}d ago`;
}
function haversine(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDist(km){ return km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`; }
function nowIso(){ return new Date().toISOString(); }
function fmtTimeFromMins(m){
  const hh = Math.floor(m/60) % 24;
  const mm = m % 60;
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh % 12 || 12;
  return mm === 0 ? `${h12} ${ampm}` : `${h12}:${String(mm).padStart(2,'0')} ${ampm}`;
}

/* ============= OPENING_HOURS PARSER ============= */
function computeOpenStatus(hours){
  if (!hours) return { isOpen:null, label:'Hours not listed', shortLabel:'Hours not listed' };
  const h = hours.trim().toLowerCase();
  if (h === '24/7' || h.includes('24/7')) return { isOpen:true, label:'Open 24/7', shortLabel:'Open 24/7' };
  if (h.includes('sunrise') || h.includes('sunset')) return { isOpen:null, label:hours, shortLabel:hours };
  const now = new Date();
  const dayIdx = now.getDay();
  const currentMins = now.getHours() * 60 + now.getMinutes();
  const dayMap = { su:0, mo:1, tu:2, we:3, th:4, fr:5, sa:6 };
  const dayOrder = ['mo','tu','we','th','fr','sa','su'];
  function expandDayRange(spec){
    const parts = spec.split(',').map(s=>s.trim()).filter(Boolean);
    const days = new Set();
    for (const part of parts){
      const range = part.match(/^([a-z]{2})-([a-z]{2})$/i);
      if (range){
        const startIdx = dayOrder.indexOf(range[1].toLowerCase().slice(0,2));
        const endIdx = dayOrder.indexOf(range[2].toLowerCase().slice(0,2));
        if (startIdx === -1 || endIdx === -1) continue;
        let i = startIdx;
        for (let guard=0; guard<8; guard++){
          days.add(dayMap[dayOrder[i]]);
          if (i === endIdx) break;
          i = (i + 1) % 7;
        }
      } else {
        const abbrev = part.toLowerCase().slice(0,2);
        if (dayMap[abbrev] !== undefined) days.add(dayMap[abbrev]);
      }
    }
    return days;
  }
  function parseTimeRanges(str){
    const ranges = [];
    const re = /(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g;
    let m;
    while ((m = re.exec(str)) !== null){
      ranges.push({ open: parseInt(m[1])*60 + parseInt(m[2]), close: parseInt(m[3])*60 + parseInt(m[4]) });
    }
    return ranges;
  }
  const rules = hours.split(';').map(s=>s.trim()).filter(Boolean);
  let matchedToday = false;
  let todayRanges = [];
  let nextOpenToday = null;
  for (const rule of rules){
    const m = rule.match(/^([A-Za-z,\s-]+?)\s+(.+)$/);
    if (!m) continue;
    const daySpec = m[1].trim();
    const timeSpec = m[2].trim();
    if (/^off$/i.test(timeSpec)) continue;
    if (/^PH/i.test(daySpec)) continue;
    const days = expandDayRange(daySpec);
    if (days.has(dayIdx)){
      matchedToday = true;
      const ranges = parseTimeRanges(timeSpec);
      for (const r of ranges){
        todayRanges.push(r);
        if (r.open > currentMins){
          if (nextOpenToday === null || r.open < nextOpenToday) nextOpenToday = r.open;
        }
      }
    }
  }
  if (!matchedToday) return { isOpen:false, label:'Closed today', shortLabel:'Closed today' };
  for (const r of todayRanges){
    const closeMins = r.close === 0 ? 1440 : r.close;
    if (r.close > r.open){
      if (currentMins >= r.open && currentMins < closeMins){
        return { isOpen:true, label:`Open now · closes ${fmtTimeFromMins(closeMins)}`, shortLabel:'Open now' };
      }
    } else {
      if (currentMins >= r.open || currentMins < r.close){
        return { isOpen:true, label:'Open now', shortLabel:'Open now' };
      }
    }
  }
  if (nextOpenToday !== null){
    const timeStr = fmtTimeFromMins(nextOpenToday);
    return { isOpen:false, label:`Closed · opens ${timeStr}`, shortLabel:`Opens ${timeStr}` };
  }
  return { isOpen:false, label:'Closed now', shortLabel:'Closed now' };
}

function extractActivities(tags){

/* ============= OVERPASS ============= */
const OVERPASS_ENDPOINTS = [
  'https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass-api.de/api/interpreter',
];
let lastGoodEndpoint = null;

function buildOverpassQuery(lat, lng, radiusMeters, categoryId){
  const a = `(around:${radiusMeters},${lat},${lng})`;
  const filters = CATEGORY_OSM_FILTERS[categoryId] || CATEGORY_OSM_FILTERS['All'];
  const selectors = filters.map(f => `${f}${a};`).join('');
  return `[out:json][timeout:20][maxsize:8Mi];(${selectors});out center tags 80;`;
}
async function fetchOverpass(lat, lng, radiusKm, categoryId, onRetry){
  const query = buildOverpassQuery(lat, lng, Math.round(radiusKm*1000), categoryId);
  let endpoints = [...OVERPASS_ENDPOINTS];
  if (lastGoodEndpoint && endpoints.includes(lastGoodEndpoint)){
    endpoints = [lastGoodEndpoint, ...endpoints.filter(e => e !== lastGoodEndpoint)];
  }
  let lastErr = null;
  for (let i = 0; i < endpoints.length; i++){
    const url = endpoints[i];
    if (i > 0 && onRetry) onRetry(i);
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 15000);
    try{
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(query),
        signal: controller.signal,
      });
      clearTimeout(timer);
      if (!res.ok){ lastErr = new Error(`Overpass ${res.status}`); continue; }
      const text = await res.text();
      if (!text.trim().startsWith('{')){ lastErr = new Error('Non-JSON response'); continue; }
      const json = JSON.parse(text);
      lastGoodEndpoint = url;
      return { elements: json.elements || [], endpoint: url };
    } catch(e){
      clearTimeout(timer);
      lastErr = e;
      await new Promise(r=>setTimeout(r, 400));
    }
  }
  throw lastErr || new Error('All Overpass endpoints failed');
}

function categorize(tags){
  const sport = (tags.sport||'').toLowerCase();
  const leisure = (tags.leisure||'').toLowerCase();
  const amenity = (tags.amenity||'').toLowerCase();
  const club = (tags.club||'').toLowerCase();
  const tourism = (tags.tourism||'').toLowerCase();
  if (leisure==='escape_game') return 'Experiences';

  if (leisure==='amusement_arcade') return 'Experiences';
  if (leisure==='water_park') return 'Experiences';
  if (leisure==='miniature_golf') return 'Experiences';
  if (sport.includes('karting') || sport.includes('paintball') || sport.includes('laser_tag')) return 'Experiences';
  if (tourism==='zoo' || tourism==='aquarium' || tourism==='theme_park') return 'Experiences';
  if (sport.includes('tennis')) return 'Tennis';
  if (sport.includes('soccer')||sport.includes('football')||sport.includes('futsal')) return 'Football';
  if (sport.includes('basketball')) return 'Basketball';

  if (sport.includes('run')||sport.includes('athletics')) return 'Running';
  if (sport.includes('yoga')) return 'Fitness';
  if (sport.includes('chess')) return 'Chess';
  if (leisure==='fitness_centre') return 'Gym';
  if (leisure==='sports_centre') return 'SportsCentre';
  if (leisure==='swimming_pool') return 'Swimming';
  if (leisure==='stadium') return 'Competitions';
  if (leisure==='park' || leisure==='garden') return 'Parks';
  if (leisure==='playground') return 'Parks';

  if (leisure==='pitch'){
    if (sport.includes('tennis')) return 'Tennis';
    if (sport.includes('basket')) return 'Basketball';

    return 'Fitness';
  }

  if (amenity==='arts_centre') return 'Art';
  if (amenity==='music_school') return 'Music';

  if (amenity==='theatre' || amenity==='cinema') return 'Events';
  if (amenity==='dojo') return 'Martial Arts';
  if (amenity==='internet_cafe') return 'Gaming';
  if (club.includes('chess')) return 'Chess';
  if (club.includes('music')) return 'Music';
  if (club.includes('sport')) return 'Fitness';
  return 'Other';
}
function subcategoryFor(tags){
  const sport = tags.sport ? tags.sport.replace(/_/g,' ') : '';
  const leisure = tags.leisure ? tags.leisure.replace(/_/g,' ') : '';
  const amenity = tags.amenity ? tags.amenity.replace(/_/g,' ') : '';
  const tourism = tags.tourism ? tags.tourism.replace(/_/g,' ') : '';
  const val = sport || leisure || amenity || tourism;
  return val ? val.charAt(0).toUpperCase() + val.slice(1) : 'Activity';
}
function elementToActivity(el, userLoc, area, t){
  const tags = el.tags || {};
  const lat = el.lat != null ? el.lat : (el.center && el.center.lat);
  const lng = el.lon != null ? el.lon : (el.center && el.center.lon);
  if (lat == null || lng == null) return null;
  const name = tags['name:en'] || tags.name || tags['name:ar'] || null;
  if (!name) return null;
  const category = categorize(tags);
  const sub = subcategoryFor(tags);
  const offers = extractActivities(tags);
  const dist = userLoc ? haversine(userLoc.lat, userLoc.lng, lat, lng) : 0;
  const addrParts = [tags['addr:housenumber'], tags['addr:street'], tags['addr:suburb'], tags['addr:city'], tags['addr:state']].filter(Boolean);
  const address = addrParts.length ? addrParts.join(', ') : (tags['addr:full'] || `${name} — approximate location`);
  let score = 40;
  const checks = [t('check_location')];
  if (tags.website || tags['contact:website']) { score += 25; checks.push(t('check_website')); }
  if (tags.phone || tags['contact:phone']) { score += 15; checks.push(t('check_phone')); }
  if (tags.opening_hours) { score += 10; checks.push(t('check_hours')); }
  if (tags.email || tags['contact:email']) { score += 5; checks.push(t('check_email')); }
  if (tags.operator) { score += 5; checks.push(t('check_operator')); }
  score = Math.min(score, 95);
  const verification = score >= 75 ? 'verified' : (score >= 55 ? 'official' : 'needs_confirm');
  const descParts = [];
  if (tags.description) descParts.push(tags.description);
  if (offers.length) descParts.push(`Activities available: ${offers.join(', ')}.`);
  if (tags.opening_hours) descParts.push(`Opening hours: ${tags.opening_hours}.`);
  if (tags.operator) descParts.push(`Operated by ${tags.operator}.`);
  descParts.push(t('sourceIsCommunity'));
  const description = descParts.join(' ');
  const osmType = el.type;
  const source_url = `https://www.openstreetmap.org/${osmType}/${el.id}`;
  return {
    id: `osm-${osmType}-${el.id}`,
    name, category, subcategory: sub, type: t('kindVenue'),
    offers,
    organizer: tags.operator || name,
    description, lat, lng, address,
    area: areaFromCoords(lat, lng, area),
    opening_hours: tags.opening_hours || null,
    open_status: computeOpenStatus(tags.opening_hours),
    website: tags.website || tags['contact:website'] || null,
    phone: tags.phone || tags['contact:phone'] || null,
    email: tags.email || tags['contact:email'] || null,
    source_url, source_name:'OpenStreetMap', source_type:'open_data',
    verification, score, checks,
    last_checked: nowIso(),
    distance_km: dist,
    is_demo: false,
  };
}
function elementsToActivities(elements, userLoc, area, t){
  const out = [];
  const seen = new Set();
  for (const el of elements){
    const a = elementToActivity(el, userLoc, area, t);
    if (!a) continue;
    const key = `${a.name.toLowerCase()}|${a.lat.toFixed(4)}|${a.lng.toFixed(4)}`;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(a);
  }
  out.sort((a,b)=> a.distance_km - b.distance_km);
  return out;
}
function getDemoActivities(userLoc, catId){

}
async function reverseGeocode(lat, lng){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=14&addressdetails=1`, { headers:{'Accept':'application/json'} });
    const j = await r.json();
    const a = j.address || {};
    const area = a.suburb || a.neighbourhood || a.village || a.town || a.city_district || a.county || '';
    const city = a.city || a.state || a.country || '';
    const label = [area, city].filter(Boolean).join(', ') || j.display_name || 'Current location';
    return { label, area: area || city || 'Nearby' };
  } catch(e){ return { label:'Current location', area:'Nearby' }; }
}
function useLS(key, initial){
  const [v, setV] = useState(()=>{
    try{ const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
    catch{ return initial; }
  });
  useEffect(()=>{ try{ localStorage.setItem(key, JSON.stringify(v)); }catch{} }, [key, v]);
  return [v, setV];
}
function parseQuery(q){
  const f = {};
  if (!q) return f;
  const lower = q.toLowerCase();
  const aliases = {
    tennis:'Tennis', football:'Football', soccer:'Football', basketball:'Basketball',
    swim:'Swimming', run:'Running', cycl:'Cycling', bike:'Cycling',
    hik:'Hiking', karate:'Martial Arts', martial:'Martial Arts',
    chess:'Chess', game:'Gaming', gaming:'Gaming',
    study:'Study', library:'Library', coding:'Coding', program:'Coding',
    tech:'Technology', hackathon:'Hackathons', workshop:'Workshops',
    art:'Art', paint:'Art', music:'Music', guitar:'Music', dance:'Dance',
    volunteer:'Volunteering', community:'Community',
    gym:'Gym', fitness:'Fitness', yoga:'Fitness',
    park:'Parks', garden:'Parks',
    bowling:'Experiences', 'escape room':'Experiences', arcade:'Experiences',
    trampoline:'Experiences', zoo:'Experiences', aquarium:'Experiences',
    outdoor:'Outdoor', indoor:'Indoor',
    tournament:'Tournaments', competition:'Competitions',
    class:'Classes', course:'Classes', lesson:'Classes',
    camp:'Camps', event:'Events',
  };
  for (const k in aliases){ if (lower.includes(k)){ f.category = aliases[k]; break; } }
  const cleaned = q.replace(/\b(near me|nearby|around me|within \d+ km|under \d+|for|the|a|an|in|at|and|to|of|i|want|things to do|activities?)\b/gi,'').trim();
  if (cleaned.length > 1) f.text = cleaned;
  return f;
}

/* ============================================================
   GOOGLE MAPS DIRECTIONS URL — path-based format
   ============================================================ */
function googleMapsDirectionsUrl(destLat, destLng, originLat, originLng){
  const dLat = Number(destLat);
  const dLng = Number(destLng);
  if (!isFinite(dLat) || !isFinite(dLng) ||
      dLat < -90 || dLat > 90 || dLng < -180 || dLng > 180){
    return '#';
  }
  if (originLat != null && originLng != null){
    const oLat = Number(originLat);
    const oLng = Number(originLng);
    if (isFinite(oLat) && isFinite(oLng) &&
        oLat >= -90 && oLat <= 90 && oLng >= -180 && oLng <= 180){
      return `https://www.google.com/maps/dir/${oLat},${oLng}/${dLat},${dLng}/`;
    }
  }
  return `https://www.google.com/maps/search/?api=1&query=${dLat},${dLng}`;
}
function osmDirectionsUrl(destLat, destLng, originLat, originLng){
  const dLat = Number(destLat);
  const dLng = Number(destLng);
  if (!isFinite(dLat) || !isFinite(dLng)) return '#';
  if (originLat != null && originLng != null){
    const oLat = Number(originLat);
    const oLng = Number(originLng);
    if (isFinite(oLat) && isFinite(oLng)){
      return `https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=${oLat}%2C${oLng}%3B${dLat}%2C${dLng}`;
    }
  }
  return `https://www.openstreetmap.org/?mlat=${dLat}&mlon=${dLng}#map=17/${dLat}/${dLng}`;
}

   GEO SANITY CHECK
   ============================================================ */
function isCoordinateNearOman(lat, lng){
  let bestD = Infinity;
  for (const a of OMAN_AREA_CENTRES){
    const d = haversine(lat, lng, a.lat, a.lng);
    if (d < bestD) bestD = d;
  }
  return bestD;
}
function isGeoTrustworthy(lat, lng, accuracyMeters){
  if (accuracyMeters != null && accuracyMeters > 500) return { ok:false, reason:'poor-accuracy' };
  const d = isCoordinateNearOman(lat, lng);
  if (d > 150) return { ok:false, reason:'far-from-known' };
  return { ok:true, nearest: d };
}

/* ============================================================
   MapView — with marker clustering, user pulse, radius circle
   ============================================================ */
function MapView({ activities, userLoc, onOpen, selectedId, t, radiusKm }){
  const ref = useRef(null);
  const mapRef = useRef(null);
  const clusterRef = useRef(null);
  const userMarkerRef = useRef(null);
  const radiusCircleRef = useRef(null);
  const markersRef = useRef({});
  const [tilesFailed, setTilesFailed] = useState(false);

  // Initialize map once
  useEffect(()=>{
    if (!ref.current || mapRef.current) return;
    const start = userLoc && isFinite(userLoc.lat) && isFinite(userLoc.lng)
      ? [userLoc.lat, userLoc.lng]
      : [23.6100, 58.2000];
    const map = L.map(ref.current, {
      zoomControl: true,
      attributionControl: true,
      minZoom: 9,
      maxZoom: 18,
    }).setView(start, 12);

    const cfg = TILE_LAYERS[DEFAULT_TILES];
    const layer = L.tileLayer(cfg.url, {
      attribution: cfg.attribution,
      maxZoom: cfg.maxZoom,
      subdomains: cfg.subdomains,
    });
    let errors = 0;
    layer.on('tileerror', ()=>{ errors++; if (errors > 3) setTilesFailed(true); });
    layer.addTo(map);

    // Marker cluster group — collapses overlapping markers
    const cluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 45,
      spiderfyOnMaxZoom: true,
      disableClusteringAtZoom: 15,
      iconCreateFunction: (c) => {
        const count = c.getChildCount();
        const size = count < 10 ? 36 : count < 100 ? 42 : 48;
        return L.divIcon({
          html: `<div style="
            width:${size}px;height:${size}px;border-radius:50%;
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            color:#fff;display:flex;align-items:center;justify-content:center;
            font-weight:800;font-size:13px;font-family:inherit;
            border:3px solid #fff;box-shadow:0 6px 16px rgba(99,102,241,.45);
          ">${count}</div>`,
          className: '',
          iconSize: [size, size],
        });
      },
    });
    map.addLayer(cluster);
    clusterRef.current = cluster;
    mapRef.current = map;

    return () => { map.remove(); mapRef.current = null; clusterRef.current = null; };
  }, []);

  // Update markers + user position + radius circle
  useEffect(()=>{
    const map = mapRef.current;
    const cluster = clusterRef.current;
    if (!map || !cluster) return;

    // Clear previous
    cluster.clearLayers();
    Object.values(markersRef.current).forEach(m => cluster.removeLayer(m));
    markersRef.current = {};
    if (userMarkerRef.current) { map.removeLayer(userMarkerRef.current); userMarkerRef.current = null; }
    if (radiusCircleRef.current) { map.removeLayer(radiusCircleRef.current); radiusCircleRef.current = null; }

    // --- User pulse + radius circle ---
    if (userLoc && isFinite(userLoc.lat) && isFinite(userLoc.lng)){
      const userIcon = L.divIcon({
        className: '',
        iconSize: [26,26],
        iconAnchor: [13,13],
        html: `<div style="position:relative;width:26px;height:26px">
          <div style="position:absolute;inset:0;border-radius:50%;background:#6366f1;opacity:.35;animation:pulseRing 2s ease-out infinite"></div>
          <div style="position:absolute;inset:5px;border-radius:50%;background:#6366f1;border:3px solid #fff;box-shadow:0 2px 10px rgba(99,102,241,.6)"></div>
        </div>`,
      });
      const userMarker = L.marker([userLoc.lat, userLoc.lng], { icon:userIcon, zIndexOffset:1000 })
        .addTo(map)
        .bindPopup(`<b>${t('youAreHere')}</b><br/><span style="font-family:monospace;font-size:10px;color:#64748b">${userLoc.lat.toFixed(4)}, ${userLoc.lng.toFixed(4)}</span>`);
      userMarkerRef.current = userMarker;

      // Radius circle
      const rKm = radiusKm && isFinite(radiusKm) ? radiusKm : 15;
      const circle = L.circle([userLoc.lat, userLoc.lng], {
        radius: rKm * 1000,
        color: '#6366f1',
        weight: 1.5,
        opacity: 0.35,
        fillColor: '#6366f1',
        fillOpacity: 0.05,
        dashArray: '6 8',
        interactive: false,
      }).addTo(map);
      radiusCircleRef.current = circle;
    }

    // --- Activity markers (inside cluster group) ---
    const validActivities = activities.filter(a =>
      a && typeof a.lat === 'number' && typeof a.lng === 'number' &&
      isFinite(a.lat) && isFinite(a.lng) &&
      a.lat > -90 && a.lat < 90 && a.lng > -180 && a.lng < 180
    );

    validActivities.forEach(a=>{
      const color = CATEGORY_COLORS[a.category] || '#6366f1';
      const isOpenNow = a.open_status && a.open_status.isOpen === true;
      const isDemo = !!a.is_demo;
      const ring = isOpenNow
        ? 'box-shadow:0 0 0 3px rgba(16,185,129,.55), 0 6px 14px rgba(15,23,42,.28);'
        : 'box-shadow:0 6px 14px rgba(15,23,42,.28);';
      const demoStyle = isDemo ? 'border-style:dashed; border-width:3px;' : '';
      const icon = L.divIcon({
        className: '',
        iconSize: [34,34],
        iconAnchor: [17,34],
        html: `<div class="mpin" style="background:${color};${ring}${demoStyle}"><span>${isDemo?'?':'•'}</span></div>`,
      });
      const dist = userLoc ? haversine(userLoc.lat, userLoc.lng, a.lat, a.lng) : a.distance_km;
      const popup = `
        <div style="min-width:180px;font-family:inherit">
          ${isDemo ? '<div style="font-size:10px;font-weight:800;color:#c2410c;margin-bottom:4px;letter-spacing:.06em">DEMO</div>' : ''}
          <div style="font-weight:800;font-size:14px;margin-bottom:4px;color:#0f172a">${a.name.replace(/</g,'&lt;')}</div>
          <div style="font-size:11px;color:#64748b;margin-bottom:2px">${a.area} · ${fmtDist(dist)}</div>
          <div style="font-size:10px;color:#94a3b8;margin-bottom:6px;font-family:monospace">${a.lat.toFixed(4)}, ${a.lng.toFixed(4)}</div>
          <button onclick="window.__openActivity('${a.id}')" style="width:100%;padding:8px;border:none;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit">${t('viewDetailsBtn')}</button>
        </div>`;
      const marker = L.marker([a.lat, a.lng], { icon }).bindPopup(popup, { closeButton:true, maxWidth:260 });
      cluster.addLayer(marker);
      markersRef.current[a.id] = marker;
    });

    // --- Fit bounds: prefer user-relative view ---
    if (userLoc && isFinite(userLoc.lat) && isFinite(userLoc.lng)){
      // When user has location, always center there. If activities fit in a sane span, include them.
      if (validActivities.length > 0){
        const pts = [[userLoc.lat, userLoc.lng], ...validActivities.map(a => [a.lat, a.lng])];
        const bounds = L.latLngBounds(pts);
        const latSpan = bounds.getNorth() - bounds.getSouth();
        const lngSpan = bounds.getEast() - bounds.getWest();
        // Only fitBounds when activities are within a tight (local) cluster
        if (latSpan < 0.35 && lngSpan < 0.35){
          map.fitBounds(bounds.pad(0.12), { maxZoom: 13 });
        } else {
          // Too spread out — just zoom to user, centered
          map.setView([userLoc.lat, userLoc.lng], 12);
        }
      } else {
        map.setView([userLoc.lat, userLoc.lng], 12);
      }
    } else if (validActivities.length > 0){
      const bounds = L.latLngBounds(validActivities.map(a => [a.lat, a.lng]));
      map.fitBounds(bounds.pad(0.15), { maxZoom: 13 });
    }
  }, [activities, userLoc, t, radiusKm]);

  // Pan to selected activity
  useEffect(()=>{
    const map = mapRef.current;
    if (!map || !selectedId) return;
    const marker = markersRef.current[selectedId];
    if (marker){
      const ll = marker.getLatLng();
      map.setView(ll, Math.max(map.getZoom(), 15));
      setTimeout(() => marker.openPopup(), 260);
    }
  }, [selectedId]);

  const openRef = useRef(null);
  openRef.current = { activities, onOpen };
  useEffect(()=>{
    window.__openActivity = (id) => {
      const cur = openRef.current; if (!cur) return;
      const a = cur.activities.find(x=>x.id===id);
      if (a) cur.onOpen(a);
    };
    return () => { delete window.__openActivity; };
  }, []);

  return (
    <div className="relative w-full h-full map-wrap">
      <div ref={ref} className="w-full h-full"/>
      {tilesFailed && (
        <div className="absolute top-3 left-3 right-3 bg-white/95 backdrop-blur rounded-xl px-3 py-2 text-xs font-bold text-amber-700 shadow-lg flex items-center gap-2">
          <Ic.Alert className="w-4 h-4 shrink-0"/><span className="truncate">{t('mapTilesFailed')}</span>
        </div>
      )}
      {userLoc && (
        <div className="absolute bottom-3 left-3 bg-white/95 backdrop-blur rounded-xl px-3 py-1.5 text-[10px] font-bold text-slate-600 shadow flex items-center gap-1.5">
          <span style={{width:8,height:8,borderRadius:'50%',background:'#6366f1',display:'inline-block'}}/>
          {t('searchRadius')}: {radiusKm && isFinite(radiusKm) ? `${radiusKm} km` : '15 km'}
        </div>
      )}
    </div>
  );
}

function DetailMiniMap({ lat, lng, userLoc, color }){
  const ref = useRef(null);
  const mapRef = useRef(null);
  useEffect(()=>{
    if (!ref.current) return;
    if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
    const map = L.map(ref.current, { zoomControl:false, attributionControl:true, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, minZoom:9, maxZoom:18 }).setView([lat,lng], 14);
    mapRef.current = map;
    const cfg = TILE_LAYERS[DEFAULT_TILES];
    L.tileLayer(cfg.url, {
      attribution: cfg.attribution,
      maxZoom: cfg.maxZoom,
      subdomains: cfg.subdomains,
    }).addTo(map);
    const icon = L.divIcon({ className:'', iconSize:[30,30], iconAnchor:[15,30], html:`<div class="mpin" style="background:${color}"><span>•</span></div>` });
    L.marker([lat,lng], { icon }).addTo(map);
    if (userLoc){
      const u = L.divIcon({ className:'', iconSize:[18,18], iconAnchor:[9,9], html:`<div style="width:18px;height:18px;border-radius:50%;background:#6366f1;border:3px solid #fff;box-shadow:0 2px 8px rgba(15,23,42,.3)"></div>` });
      L.marker([userLoc.lat, userLoc.lng], { icon:u }).addTo(map);
      const pts = [[lat,lng],[userLoc.lat,userLoc.lng]];
      const bounds = L.latLngBounds(pts);
      const latSpan = bounds.getNorth() - bounds.getSouth();
      const lngSpan = bounds.getEast() - bounds.getWest();
      if (latSpan < 5 && lngSpan < 5){
        map.fitBounds(bounds, { padding:[40,40], maxZoom: 15 });
      }
    }
    return ()=>{ if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, [lat,lng,userLoc,color]);
  return <div ref={ref} className="w-full h-56 rounded-2xl overflow-hidden"/>;
}

                </a>
              )}
            </div>
          </div>
        )}
      </div>
      <div className="fixed bottom-0 inset-x-0 p-4 bg-gradient-to-t from-white via-white to-white/0 pt-8 pointer-events-none">
        <div className="max-w-3xl mx-auto pointer-events-auto">
          <a href={cta.href} target="_blank" rel="noopener noreferrer"
            className="w-full flex items-center justify-center gap-2 py-4 rounded-2xl grad text-white font-extrabold shadow-xl shadow-indigo-500/25 active:scale-[.98]">
            <CtaIcon className="w-5 h-5 shrink-0"/><span className="truncate">{cta.label}</span>
          </a>
          <p className="text-center text-[10px] text-slate-500 mt-2">{t('neverBooks')}</p>
        </div>
      </div>
    </div>
  );
}

function LocationPicker({ open, onClose, onSelect, current, t, firstTime }){
  const [q, setQ] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [results, setResults] = useState([]);
  const ref = useRef();
  useEffect(()=>{ if(open){ setQ(''); setErr(''); setResults([]); setTimeout(()=>ref.current?.focus(),150); } }, [open]);
  if (!open) return null;
  const useMyLocation = () => {
    setErr('');
    if (!navigator.geolocation){ setErr(t('geoUnsupported')); return; }
    setBusy(true);
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const { latitude, longitude } = pos.coords;
      const geo = await reverseGeocode(latitude, longitude);
      setBusy(false);
      onSelect({ lat:latitude, lng:longitude, label: geo.label, area: geo.area, source:'gps' });
    }, (e)=>{ setBusy(false); setErr(e.code===1 ? t('geoDenied') : t('geoFail')); },
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  };
  const doSearch = async () => {
    if (!q.trim()) return;
    setBusy(true); setErr(''); setResults([]);
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&q=${encodeURIComponent(q)}`);
      const j = await r.json();
      if (j && j.length) setResults(j); else setErr(t('noMatches'));
    } catch { setErr(t('searchFail')); }
    setBusy(false);
  };
  return (
    <div className="fixed inset-0 z-[80] backdrop fi" onClick={firstTime ? null : onClose}>
      <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg px-4" onClick={e=>e.stopPropagation()}>
        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden si max-h-[85vh] flex flex-col">
          <div className="p-5 border-b border-slate-100 flex items-center justify-between shrink-0">
            <div>
              <h2 className="text-lg font-extrabold tracking-tight">{firstTime ? t('pickLocationTitle') : t('changeLocation')}</h2>
              <p className="text-xs text-slate-500 mt-0.5">{firstTime ? t('pickLocationSub') : t('changeLocationSub')}</p>
            </div>
            {!firstTime && (
              <button onClick={onClose} className="p-2 rounded-full hover:bg-slate-100"><Ic.X className="w-5 h-5"/></button>
            )}
          </div>
          <div className="p-5 space-y-3 overflow-y-auto">
            <button onClick={useMyLocation} disabled={busy}
              className="w-full flex items-center gap-3 p-4 rounded-2xl border-2 border-indigo-100 bg-indigo-50/50 hover:bg-indigo-50 active:scale-[.99] transition text-left disabled:opacity-60">
              <div className="w-10 h-10 rounded-xl grad flex items-center justify-center shrink-0">
                {busy ? <Ic.Refresh className="w-5 h-5 text-white animate-spin"/> : <Ic.Crosshair className="w-5 h-5 text-white"/>}
              </div>
              <div>
                <div className="font-bold text-sm">{t('useMyLoc')}</div>
                <div className="text-xs text-slate-500">{t('useMyLocSub')}</div>
              </div>
            </button>
            <div>
              <label className="text-xs font-bold text-slate-500 uppercase tracking-wider px-1">{t('orSearchPlace')}</label>
              <div className="mt-2 flex gap-2">
                <div className="relative flex-1 min-w-0">
                  <Ic.Search className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"/>
                  <input ref={ref} value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSearch()}
                    placeholder="Seeb, Muscat · Dubai · London"
                    className="w-full pl-10 pr-3 py-3 rounded-xl bg-slate-100 border-2 border-transparent focus:border-indigo-400 focus:bg-white outline-none text-sm font-medium"/>
                </div>
                <button onClick={doSearch} disabled={busy||!q.trim()}
                  className="px-4 rounded-xl grad text-white font-bold text-sm disabled:opacity-40 active:scale-95 shrink-0">{t('search')}</button>
              </div>
              {err && <div className="mt-2 text-xs text-red-600 flex items-center gap-1.5"><Ic.Alert className="w-3.5 h-3.5"/>{err}</div>}
            </div>
            {results.length > 0 && (
              <div className="space-y-1">
                <div className="text-xs font-bold text-slate-500 uppercase tracking-wider px-1">{t('searchResults')}</div>
                {results.map((r,i)=>(
                  <button key={i} onClick={async ()=>{
                    const lat = parseFloat(r.lat), lng = parseFloat(r.lon);
                    const geo = await reverseGeocode(lat, lng);

                  }}

              <div className="text-xs font-bold text-slate-500 uppercase tracking-wider px-1 mb-2">{t('presets')}</div>

function App(){
  const [lang, setLang] = useLS('af_lang', 'en');
  const [location, setLocation] = useLS('af_location', null);
  const [savedIds, setSavedIds] = useLS('af_saved', []);
  const [recentIds, setRecentIds] = useLS('af_recent', []);
  const [preferences, setPreferences] = useLS('af_prefs', { maxDistance:null });

  const [query, setQuery] = useState('');
  const [activeQuery, setActiveQuery] = useState('');
  const [category, setCategory] = useState('All');
  const [filters, setFilters] = useState({ distance:null, openNow:false, hasContact:false });
  const [sort, setSort] = useState('nearest');
  const [tab, setTab] = useState('home');
  const [view, setView] = useState('list');
  const [showFilters, setShowFilters] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [showPicker, setShowPicker] = useState(false);
  const [firstTimePicker, setFirstTimePicker] = useState(false);
  const [detail, setDetail] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [geoState, setGeoState] = useState('idle');
  const [geoApproximate, setGeoApproximate] = useState(false);

  const [mode, setMode] = useState('demo');
  const [liveActivities, setLiveActivities] = useState([]);
  const [loading, setLoading] = useState(false);
  const [retrying, setRetrying] = useState(false);

  const t = useMemo(()=> makeT(lang), [lang]);

  useEffect(()=>{
    document.documentElement.lang = lang;
    document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
    document.body.dir = lang==='ar' ? 'rtl' : 'ltr';
  }, [lang]);

  useEffect(()=>{
    if (location) return;
    if (!navigator.geolocation){
      setGeoState('failed');
      setFirstTimePicker(true);
      setShowPicker(true);
      return;
    }
    setGeoState('locating');
    navigator.geolocation.getCurrentPosition(
      async (pos)=>{
        const { latitude, longitude, accuracy } = pos.coords;
        const trust = isGeoTrustworthy(latitude, longitude, accuracy);
        const geo = await reverseGeocode(latitude, longitude);
        setLocation({ lat:latitude, lng:longitude, label: geo.label, area: geo.area, source:'gps' });
        setGeoState('found');
        if (!trust.ok){
          setGeoApproximate(true);
        }
      },
      (err)=>{
        setGeoState(err.code === 1 ? 'denied' : 'failed');
        setFirstTimePicker(true);
        setShowPicker(true);
      },
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
  }, []);

  const effectiveRadius = useMemo(()=>{
    if (filters.distance != null) return filters.distance;
    if (preferences.maxDistance != null) return preferences.maxDistance;
    return 25;
  }, [filters.distance, preferences.maxDistance]);

  const runLiveFetch = useCallback(async (loc, radiusKm, catId)=>{
    setLoading(true); setRetrying(false);
    try{
      const { elements } = await fetchOverpass(loc.lat, loc.lng, radiusKm, catId, (i)=>{
        if (i > 0) setRetrying(true);
      });
      const live = elementsToActivities(elements, loc, loc.area, t);
      setLiveActivities(live);
      return live;
    } catch(e){
      console.warn('Live fetch failed:', e.message);
      setLiveActivities([]);
      return [];
    } finally {
      setLoading(false); setRetrying(false);
    }
  }, [t]);

  const toggleLive = async () => {
    if (!location) { setFirstTimePicker(true); setShowPicker(true); return; }
    if (mode === 'demo'){
      setMode('live');
      await runLiveFetch(location, effectiveRadius, category);
    } else {
      setMode('demo');
      setLiveActivities([]);
    }
  };

  useEffect(()=>{
    if (mode !== 'live' || !location) return;
    runLiveFetch(location, effectiveRadius, category);
  }, [mode, location?.lat, location?.lng, effectiveRadius, category, runLiveFetch]);

  const activities = useMemo(()=>{
    if (!location) return [];
    let base;
    if (mode === 'live' && liveActivities.length > 0) base = liveActivities;
    else base = getDemoActivities(location, category);
    return base.map(a => ({ ...a, area: areaFromCoords(a.lat, a.lng, a.area) }));
  }, [mode, liveActivities, location, category]);

  const showingDemo = useMemo(()=>{
    if (mode === 'demo') return true;
    if (mode === 'live' && liveActivities.length === 0 && !loading) return true;
    return false;
  }, [mode, liveActivities, loading]);

  const toggleSave = useCallback((id)=>{
    setSavedIds(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  }, [setSavedIds]);

  const openDetail = useCallback((a)=>{
    setDetail(a);
    setSelectedId(a.id);
    setRecentIds(prev => [a.id, ...prev.filter(x=>x!==a.id)].slice(0, 20));
  }, [setRecentIds]);

  const filtered = useMemo(()=>{
    if (!location) return [];
    const parsed = parseQuery(activeQuery);
    const maxDistance = filters.distance != null ? filters.distance : (preferences.maxDistance || 50);
    return activities.filter(a=>{
      const dist = haversine(location.lat, location.lng, a.lat, a.lng);
      if (dist > maxDistance) return false;
      if (filters.openNow && a.open_status.isOpen !== true) return false;
      if (filters.hasContact && !(a.website || a.phone || a.email)) return false;
      if (parsed.text){
        const hay = (a.name+' '+a.description+' '+a.organizer+' '+a.area+' '+a.category+' '+a.subcategory+' '+(a.offers||[]).join(' ')).toLowerCase();
        if (!hay.includes(parsed.text.toLowerCase())) return false;
      }
      return true;
    });
  }, [activities, location, filters, activeQuery, preferences]);

  const sorted = useMemo(()=>{
    if (!location) return [];
    const list = [...filtered];
    switch(sort){
      case 'score': return list.sort((a,b)=> (b.score||0) - (a.score||0) || a.distance_km - b.distance_km);
      case 'alpha': return list.sort((a,b)=> a.name.localeCompare(b.name));
      default:
        return list.sort((a,b)=> haversine(location.lat, location.lng, a.lat, a.lng) - haversine(location.lat, location.lng, b.lat, b.lng));
    }
  }, [filtered, sort, location]);

  const submitSearch = (q) => {
    const val = (typeof q === 'string' ? q : query).trim();
    setActiveQuery(val);
    const parsed = parseQuery(val);
    if (parsed.category) setCategory(parsed.category);
    setTab('home'); setView('list');
  };
  const clearAllFilters = () => {
    setFilters({ distance:null, openNow:false, hasContact:false });
    setCategory('All'); setQuery(''); setActiveQuery('');
  };
  const broadenSearch = () => setFilters(f => ({ ...f, distance: 50 }));
  const refreshNow = async () => {
    if (mode === 'live' && location) await runLiveFetch(location, effectiveRadius, category);
  };

  const activeFilterCount = useMemo(()=>{
    let c = 0;
    if (filters.distance != null) c++;
    if (filters.openNow) c++;
    if (filters.hasContact) c++;
    if (category && category !== 'All') c++;
    return c;
  }, [filters, category]);

  const openNowCount = useMemo(()=> sorted.filter(a => a.open_status && a.open_status.isOpen === true).length, [sorted]);

  const distanceLabel = effectiveRadius < 1 ? `${effectiveRadius*1000} m` : `${effectiveRadius} km`;
  const venuesWord = sorted.length === 1 ? t('venuesFoundSing') : t('venuesFound', { n: sorted.length });

  const displayLocation = location || { label:'—', lat:0, lng:0 };

  return (
    <div className="min-h-screen pb-20 lg:pb-0 w-full max-w-full overflow-x-clip">
      <Header location={displayLocation} onOpenLocation={()=>setShowPicker(true)}
        lang={lang} onOpenLang={()=>setLang(lang==='en'?'ar':'en')}
        onOpenAdmin={()=>setShowAdmin(true)} onRefresh={refreshNow} loading={loading} t={t} geoState={geoState}
        isLive={mode === 'live'} onToggleLive={toggleLive}/>

      <main className="max-w-7xl mx-auto px-4 py-4 lg:py-6 w-full min-w-0">
        {!location ? (
          <div className="flex flex-col items-center justify-center py-20 text-center">
            <div className="w-20 h-20 rounded-3xl grad flex items-center justify-center mb-5 shadow-lg shadow-indigo-500/25">
              <Ic.Crosshair className="w-9 h-9 text-white"/>
            </div>
            <h2 className="text-xl font-extrabold tracking-tight mb-2">{t('pickLocationTitle')}</h2>
            <p className="text-sm text-slate-500 max-w-md mb-6">{t('pickLocationSub')}</p>
            <button onClick={()=>{ setFirstTimePicker(true); setShowPicker(true); }}
              className="px-6 py-3 rounded-2xl grad text-white font-extrabold active:scale-95 shadow-lg shadow-indigo-500/25">
              {t('changeLocation')}
            </button>
          </div>
        ) : tab === 'home' ? (
          <div className="lg:grid lg:grid-cols-[280px_minmax(0,1fr)_380px] lg:gap-5 w-full min-w-0">
            <aside className="hidden lg:block min-w-0">
              <div className="sticky top-24 bg-white rounded-3xl card-s overflow-hidden h-[calc(100vh-7rem)]">
                <FiltersPanel filters={filters} setFilters={setFilters} onClose={()=>{}} resultsCount={sorted.length} t={t}/>
              </div>
            </aside>

            <section className="min-w-0 w-full">
              <div className="mb-4 w-full"><SearchBar value={query} onChange={setQuery} onSubmit={submitSearch} t={t}/></div>
              <div className="mb-3 w-full"><CategoryRow selected={category} onSelect={setCategory} lang={lang} activities={activities} t={t}/></div>
              <div className="mb-3 w-full"><QuickChips filters={filters} setFilters={setFilters} onOpenFilters={()=>setShowFilters(true)} t={t}/></div>

              <div className="flex items-center justify-between gap-3 mb-4 mt-2 min-w-0">
                <div className="min-w-0 flex-1">
                  <h2 className="text-lg font-extrabold tracking-tight truncate">
                    {activeQuery ? `${t('resultsFor')} "${activeQuery}"` : t('venuesNear')}
                  </h2>
                  <p className="text-xs text-slate-500 mt-0.5 truncate">
                    {location.label} · {distanceLabel}
                    {openNowCount > 0 && ` · ${openNowCount} open now`}
                  </p>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button onClick={()=>setShowFilters(true)}
                    className="lg:hidden flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold relative shrink-0">
                    <Ic.Filter className="w-3.5 h-3.5"/><span className="hidden sm:inline">{t('filters')}</span>
                    {activeFilterCount > 0 && (
                      <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full grad text-white text-[10px] font-extrabold flex items-center justify-center">{activeFilterCount}</span>
                    )}
                  </button>
                  <SortMenu value={sort} onChange={setSort} t={t}/>
                </div>
              </div>

              <div className="flex items-center justify-between mb-3 min-w-0">
                <p className="text-xs font-bold text-slate-500 truncate">
                  {loading ? (retrying ? t('retryingMsg') : t('scanningMsg')) : venuesWord}
                </p>
                <div className="lg:hidden flex rounded-xl border border-slate-200 bg-white p-0.5 shrink-0">
                  <button onClick={()=>setView('list')} className={`px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center transition ${view==='list'?'bg-slate-100':''}`}><Ic.List className="w-3.5 h-3.5"/></button>
                  <button onClick={()=>setView('map')} className={`px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center transition ${view==='map'?'bg-slate-100':''}`}><Ic.Map className="w-3.5 h-3.5"/></button>
                </div>
              </div>

              {geoApproximate && (
                <GeoWarningBanner location={location} onFix={()=>{ setFirstTimePicker(false); setShowPicker(true); }} t={t}/>
              )}

              {showingDemo && !loading && !geoApproximate && (
                <div className="col-span-full mb-3 bg-orange-50 border border-orange-200 rounded-2xl px-4 py-3 flex items-center gap-2 text-xs font-bold text-orange-800">
                  <Ic.Beaker className="w-4 h-4 shrink-0"/>
                  <span>{t('demoMode')} · Click "Try live data" in the header to fetch real venues.</span>
                </div>
              )}

              {view === 'map' ? (
                <div className="lg:hidden h-[calc(100vh-19rem)] rounded-3xl overflow-hidden card-s mb-4 relative">
                  <MapView activities={sorted} userLoc={location} onOpen={openDetail} selectedId={selectedId} t={t} radiusKm={effectiveRadius}/>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full min-w-0">
                  {loading && sorted.length === 0 ? (
                    Array.from({length:4}).map((_,i)=><SkeletonCard key={i}/>)
                  ) : sorted.length === 0 ? (
                    <EmptyState onBroaden={broadenSearch} onClear={clearAllFilters} reason={activities.length > 0 ? 'narrow' : 'empty'} t={t}/>
                  ) : (
                    sorted.map((a,i)=>(
                      <ActivityCard key={a.id} activity={a} userLoc={location}
                        saved={savedIds.includes(a.id)} onToggleSave={toggleSave} onOpen={openDetail} index={i} lang={lang} t={t}/>
                    ))
                  )}
                </div>
              )}
            </section>

            <aside className="hidden lg:block min-w-0">
              <div className="sticky top-24 h-[calc(100vh-7rem)] rounded-3xl overflow-hidden card-s relative">
                <MapView activities={sorted} userLoc={location} onOpen={openDetail} selectedId={selectedId} t={t} radiusKm={effectiveRadius}/>
              </div>
            </aside>
          </div>
        ) : tab === 'map' ? (
          <div className="lg:hidden w-full min-w-0">
            <div className="mb-3"><SearchBar value={query} onChange={setQuery} onSubmit={submitSearch} t={t}/></div>
            <div className="mb-3"><CategoryRow selected={category} onSelect={setCategory} lang={lang} activities={activities} t={t}/></div>
            <div className="h-[calc(100vh-16rem)] rounded-3xl overflow-hidden card-s relative">
              <MapView activities={sorted} userLoc={location} onOpen={openDetail} selectedId={selectedId} t={t} radiusKm={effectiveRadius}/>
            </div>
            <p className="text-center text-xs text-slate-500 mt-3">{venuesWord}</p>
          </div>
        ) : tab === 'saved' ? (
          <SavedView activities={activities} savedIds={savedIds} onOpen={openDetail} onToggleSave={toggleSave} userLoc={location} lang={lang} t={t}/>
        ) : (
          <ProfileView location={location} onOpenLocation={()=>{ setFirstTimePicker(false); setShowPicker(true); }}
            savedIds={savedIds} recentIds={recentIds} preferences={preferences}
            setPreferences={setPreferences} onOpenLang={()=>setLang(lang==='en'?'ar':'en')} lang={lang} t={t}/>
        )}
      </main>

      <BottomNav tab={tab} setTab={setTab} savedCount={savedIds.length} t={t}/>

      {showFilters && (
        <div className="fixed inset-0 z-[75] lg:hidden backdrop fi" onClick={()=>setShowFilters(false)}>
          <div className="absolute inset-x-0 bottom-0 top-6 bg-white rounded-t-3xl overflow-hidden su flex flex-col max-w-lg mx-auto" onClick={e=>e.stopPropagation()}>
            <FiltersPanel filters={filters} setFilters={setFilters} onClose={()=>setShowFilters(false)} resultsCount={sorted.length} t={t}/>
          </div>
        </div>
      )}

      <LocationPicker open={showPicker} onClose={()=>{ setShowPicker(false); setFirstTimePicker(false); }}
        current={location || { label:'', lat:0, lng:0 }}
        onSelect={(loc)=>{ setLocation(loc); setShowPicker(false); setFirstTimePicker(false); setGeoApproximate(false); }}
        firstTime={firstTimePicker} t={t}/>

      {detail && (
        <ActivityDetail activity={detail} userLoc={location} saved={savedIds.includes(detail.id)}
          onToggleSave={toggleSave} onClose={()=>setDetail(null)} lang={lang} t={t}/>
      )}

      {showAdmin && <AdminDashboard activities={activities} onClose={()=>setShowAdmin(false)} t={t}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
